<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Feedback Form</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="container">
      <h1>Feedback Form</h1>
      <p class="intro">Please share your feedback with us.</p>

      <form id="feedback-form" class="form">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" maxlength="60" required>

        <label for="email">Email</label>
        <input id="email" name="email" type="email" maxlength="120">

        <fieldset>
          <legend>Rating</legend>
          <label><input type="radio" name="rating" value="1" required> 1</label>
          <label><input type="radio" name="rating" value="2"> 2</label>
          <label><input type="radio" name="rating" value="3"> 3</label>
          <label><input type="radio" name="rating" value="4"> 4</label>
          <label><input type="radio" name="rating" value="5"> 5</label>
        </fieldset>

        <label for="message">Comments</label>
        <textarea id="message" name="message" rows="5" maxlength="500" required></textarea>
        <small id="character-count">0/500</small>

        <button type="submit">Submit Feedback</button>
        <p id="form-message" class="success" role="status" aria-live="polite"></p>
      </form>

      <section class="responses">
        <div class="responses-heading">
          <h2>Submitted Feedback</h2>
          <button id="clear-button" class="clear-button" type="button" hidden>Clear all</button>
        </div>
        <div id="feedback-list">
          <p class="empty-state">No feedback submitted yet.</p>
        </div>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
